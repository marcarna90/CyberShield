name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ lint
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff (lint + format)
        run: |
          pip install ruff==0.17.2
          ruff check .
          ruff format --check .
      - name: ShellCheck
        run: shellcheck docker/entrypoint.sh scripts/*.sh
      - name: Compose file validation
        run: docker compose config --quiet

  # ------------------------------------------------------------ unit tests
  test:
    name: Tests (coverage >= 90%)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nmap libpcap0.8t64
      - name: Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest
        run: >
          pytest --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/coverage --junitxml=reports/junit.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            reports/coverage.xml
            reports/coverage/
            reports/junit.xml

  # -------------------------------------------------------- security checks
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install tools
        run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r app -f txt
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Secret patterns
        run: |
          if grep -RInE "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" --exclude-dir=.git . ; then
            echo "Potential secret committed" && exit 1
          fi

  # --------------------------------------------------------- python build
  build:
    name: Build package
    runs-on: ubuntu-24.04
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build sdist + wheel
        run: |
          pip install build==1.2.2
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # --------------------------------------------------------- docker image
  docker:
    name: Docker image + stack smoke test
    runs-on: ubuntu-24.04
    needs: [test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: cybershield:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the stack exactly like a user would
        run: docker compose up -d --no-build --wait --wait-timeout 240
      - name: Smoke test (login, host audit, scan, report)
        run: |
          set -euo pipefail
          PW="$(docker compose exec -T api cat /run/cybershield-secrets/admin_password)"
          TOKEN="$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/token \
            --data-urlencode username=admin --data-urlencode "password=${PW}" | jq -r .access_token)"
          AUTH="Authorization: Bearer ${TOKEN}"
          curl -sf http://127.0.0.1:8000/api/v1/health/ready
          curl -sf -X POST -H "$AUTH" http://127.0.0.1:8000/api/v1/audits/host | jq '.score'
          curl -sf -X POST -H "$AUTH" -H 'Content-Type: application/json' http://127.0.0.1:8000/api/v1/scans \
            -d '{"targets":["127.0.0.1"],"profile":"quick","authorization_confirmed":true}' | jq '.id'
          curl -sf -X POST -H "$AUTH" http://127.0.0.1:8000/api/v1/admin/demo-data | jq '.'
          curl -sf -X POST -H "$AUTH" -H 'Content-Type: application/json' http://127.0.0.1:8000/api/v1/reports \
            -d '{"report_type":"executive","formats":["pdf","html","json"]}' | jq 'length'
          curl -sf http://127.0.0.1:8501/_stcore/health
          curl -sf -H "$AUTH" http://127.0.0.1:8000/api/v1/audit-trail/verify | jq -e '.valid'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
      - name: Publish to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          docker tag cybershield:1.0.0 "$IMAGE"
          docker push "$IMAGE"
